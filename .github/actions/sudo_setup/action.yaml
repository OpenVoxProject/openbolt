name: Sudo test setup
description: Give the runner user a password and a sudo rule for the tests that escalate privileges
runs:
  using: composite
  steps:
    - name: Create non-sudo user
      shell: bash
      run: |
        echo 'runner:runner' | sudo chpasswd
        sudo sh -c "echo 'runner  ALL=(ALL) PASSWD:ALL' >> /etc/sudoers"
