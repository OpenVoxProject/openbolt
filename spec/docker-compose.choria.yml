name: openbolt-choria

x-choria_node: &choria_node
  entrypoint: ["/usr/bin/choria"]
  command: ["server", "run", "--config", "/etc/choria/server.conf"]
  depends_on:
    choria_broker:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "choria", "tool", "status", "--status-file", "/var/log/choria-status.json"]
    interval: 5s
    timeout: 5s
    retries: 24

services:
  # OpenVox configures each image for its certname at build time, so every
  # service builds its own. The certificates come from the fixture CA,
  # generated by acceptance:choria:up under fixtures/choria/ssl, and mount
  # where Choria's default security provider expects the agent's certificates.
  choria_broker:
    build:
      context: .
      dockerfile: Dockerfile.choria
      args:
        CERTNAME: choria_broker
    image: openbolt_choria_broker
    hostname: choria_broker
    entrypoint: ["/usr/bin/choria"]
    command: ["broker", "run", "--config", "/etc/choria/broker.conf"]
    volumes:
      - ./fixtures/choria/ssl/choria_broker/cert.pem:/etc/puppetlabs/puppet/ssl/certs/choria_broker.pem:ro
      - ./fixtures/choria/ssl/choria_broker/key.pem:/etc/puppetlabs/puppet/ssl/private_keys/choria_broker.pem:ro
      - ./fixtures/ssl/ca.pem:/etc/puppetlabs/puppet/ssl/certs/ca.pem:ro
      - ./fixtures/ssl/crl.pem:/etc/puppetlabs/puppet/ssl/crl.pem:ro
    ports:
      - "127.0.0.1:4222:4222"
    # bash opens a TCP connection for a /dev/tcp path and exits non-zero when
    # nothing listens, which checks the port without nc or curl in the image
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4222"]
      interval: 2s
      timeout: 3s
      retries: 15

  choria_node1:
    <<: *choria_node
    build:
      context: .
      dockerfile: Dockerfile.choria
      args:
        CERTNAME: choria_node1
    image: openbolt_choria_node1
    hostname: choria_node1
    volumes:
      - ./fixtures/choria/ssl/choria_node1/cert.pem:/etc/puppetlabs/puppet/ssl/certs/choria_node1.pem:ro
      - ./fixtures/choria/ssl/choria_node1/key.pem:/etc/puppetlabs/puppet/ssl/private_keys/choria_node1.pem:ro
      - ./fixtures/ssl/ca.pem:/etc/puppetlabs/puppet/ssl/certs/ca.pem:ro
      - ./fixtures/ssl/crl.pem:/etc/puppetlabs/puppet/ssl/crl.pem:ro

  choria_node2:
    <<: *choria_node
    build:
      context: .
      dockerfile: Dockerfile.choria
      args:
        CERTNAME: choria_node2
    image: openbolt_choria_node2
    hostname: choria_node2
    volumes:
      - ./fixtures/choria/ssl/choria_node2/cert.pem:/etc/puppetlabs/puppet/ssl/certs/choria_node2.pem:ro
      - ./fixtures/choria/ssl/choria_node2/key.pem:/etc/puppetlabs/puppet/ssl/private_keys/choria_node2.pem:ro
      - ./fixtures/ssl/ca.pem:/etc/puppetlabs/puppet/ssl/certs/ca.pem:ro
      - ./fixtures/ssl/crl.pem:/etc/puppetlabs/puppet/ssl/crl.pem:ro

  # Without the agents OpenBolt uses, through its per-node Hiera data, for the
  # error cases
  choria_node3:
    <<: *choria_node
    build:
      context: .
      dockerfile: Dockerfile.choria
      args:
        CERTNAME: choria_node3
    image: openbolt_choria_node3
    hostname: choria_node3
    volumes:
      - ./fixtures/choria/ssl/choria_node3/cert.pem:/etc/puppetlabs/puppet/ssl/certs/choria_node3.pem:ro
      - ./fixtures/choria/ssl/choria_node3/key.pem:/etc/puppetlabs/puppet/ssl/private_keys/choria_node3.pem:ro
      - ./fixtures/ssl/ca.pem:/etc/puppetlabs/puppet/ssl/certs/ca.pem:ro
      - ./fixtures/ssl/crl.pem:/etc/puppetlabs/puppet/ssl/crl.pem:ro
