version: "3"
services:
  ubuntu_node:
    build: .
    container_name: ubuntu_node
    ports:
      - "127.0.0.1:20022:22"

  openvox_9_node:
    build:
      context: .
      args:
        PUPPET_COLLECTION: openvox9
    container_name: openvox_9_node
    ports:
      - "127.0.0.1:20025:22"

  postgres:
    image: postgres:11.11
    environment:
      POSTGRES_PASSWORD: puppetdb
      POSTGRES_USER: puppetdb
      POSTGRES_DB: puppetdb
    volumes:
      - ./fixtures/puppetdb/custom_source:/docker-entrypoint-initdb.d

  puppetdb:
    build:
      context: .
      dockerfile: Dockerfile.puppetdb
    depends_on:
      - postgres
      - puppetserver
    environment:
      USE_PUPPETSERVER: 'false'
      CERTNAME: pdb
    ports:
      - "127.0.0.1:18081:8081"

  puppetserver:
    build:
      context: .
      dockerfile: Dockerfile.puppetserver
    image: puppet-server
    ports:
      - "127.0.0.1:8140:8140"
    volumes:
      - ./fixtures/modules:/etc/puppetlabs/code/modules
      - ./fixtures/bolt_server/projects:/etc/puppetlabs/code/projects
