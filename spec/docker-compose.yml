services:
  ubuntu_node:
    build: .
    container_name: ubuntu_node
    ports:
      - "127.0.0.1:20022:22"

  openvox_9_node:
    build:
      context: .
      args:
        PUPPET_COLLECTION: openvox9
    container_name: openvox_9_node
    ports:
      - "127.0.0.1:20025:22"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: openvoxdb
      POSTGRES_USER: openvoxdb
      POSTGRES_PASSWORD: openvoxdb
    volumes:
      - ./fixtures/openvoxdb/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "openvoxdb", "-d", "openvoxdb"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Serves the fixture certificates instead of fetching its own from the server
  openvoxdb:
    image: ghcr.io/openvoxproject/openvoxdb:8
    hostname: openvoxdb
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USE_OPENVOXSERVER: 'false'
    volumes:
      - ./fixtures/ssl/cert.pem:/opt/puppetlabs/server/data/puppetdb/certs/certs/server.crt:ro
      - ./fixtures/ssl/key.pem:/opt/puppetlabs/server/data/puppetdb/certs/private_keys/server.key:ro
      - ./fixtures/ssl/ca.pem:/opt/puppetlabs/server/data/puppetdb/certs/certs/ca.pem:ro
      - ./fixtures/openvoxdb/enable-ssl.sh:/container-custom-entrypoint.d/enable-ssl.sh:ro
    ports:
      - "127.0.0.1:18081:8081"

  # Runs without a CA, with the fixture certificates and the fixture modules in
  # its production environment. The hostname is the CN of the fixture certificate.
  openvoxserver:
    image: ghcr.io/openvoxproject/openvoxserver:9
    hostname: boltserver
    environment:
      CERTNAME: boltserver
      OPENVOXSERVER_HOSTNAME: boltserver
      CA_ENABLED: 'false'
      USE_OPENVOXDB: 'false'
    volumes:
      - ./fixtures/ssl/cert.pem:/etc/puppetlabs/puppet/ssl/certs/boltserver.pem:ro
      - ./fixtures/ssl/key.pem:/etc/puppetlabs/puppet/ssl/private_keys/boltserver.pem:ro
      - ./fixtures/ssl/ca.pem:/etc/puppetlabs/puppet/ssl/certs/ca.pem:ro
      - ./fixtures/ssl/crl.pem:/etc/puppetlabs/puppet/ssl/crl.pem:ro
      - ./fixtures/modules:/etc/puppetlabs/code/environments/production/modules:ro
    ports:
      - "127.0.0.1:8140:8140"
